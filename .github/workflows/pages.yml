# Bygger dashboardet som statiske filer og udgiver dem på GitHub Pages.
#
# VIGTIGT: I repoets Settings → Pages skal "Source" stå til "GitHub Actions".
# Står den på "Deploy from a branch", bygger GitHub i stedet med Jekyll, som
# ikke kan køre Next.js og derfor blot viser README-filen.
name: Udgiv til GitHub Pages

on:
  push:
    branches:
      - main
      - claude/beautiful-noether-42c1i9
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Lad en igangværende udgivelse blive færdig, men spring ventende over.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kontrollér typer
        run: npm run typecheck

      - name: Byg statisk site
        run: npm run build:pages
        env:
          # Et projektsite ligger på https://<bruger>.github.io/<repo>/,
          # så alle stier skal have repo-navnet som præfiks.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  udgiv:
    needs: byg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
